name: Refresh wholesale prices

# The wholesale price page (wholesale.html) reads wholesale_prices.json,
# written by tools/fetch_wholesale_prices.py from the Electricity Authority's
# half-hourly final prices and Stats NZ's CPI. On the 3rd of each month this
# fetches the newest two months (older days come from the published file),
# checks the file, and commits and deploys it when it changed. A commit made
# with GITHUB_TOKEN does not start other workflows, so this one starts the
# site deploy itself.

on:
  schedule:
    - cron: "0 20 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - name: Fetch the newest months and CPI, rebuild
        run: python tools/fetch_wholesale_prices.py
      # The EA can revise a month after the fact (a pricing-error reset). The
      # month six months back is fetched again each run, so a revision is
      # picked up within half a year; the commit shows which days moved.
      - name: Fetch again the month six months back
        run: python tools/fetch_wholesale_prices.py --months "$(date -u -d '6 months ago' +%Y%m)"
      - name: Check
        run: |
          WHOLESALE_FRESH=1 python tests/test_wholesale.py
          node tests/test_wholesale.mjs
      - name: Commit and deploy if the prices changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- wholesale_prices.json; then
            echo "Nothing new."; exit 0
          fi
          git config user.name "wholesale-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add wholesale_prices.json
          git commit -m "Wholesale prices: the Electricity Authority's latest days [automated]"
          git push
          gh workflow run pages.yml --ref main
