<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar data explorer</title>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="site-config.js"></script>
<script src="map_layers.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="map_layers.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #f2f4f7; background: #111418; }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 16px; background: #191e25; }
  .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; }
  nav { display: flex; gap: 12px; flex-wrap: wrap; }
  a { color: #b9d8ff; }
  #source-controls { margin-top: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  select, button { font: inherit; }
  #status { font-size: 12px; color: #b6bdc9; margin: 6px 0 0; }
  #status.error { color: #ffb7a9; }
  #map { flex: 1; min-height: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <h1>Solar data explorer</h1>
      <nav aria-label="Pages">
        <a href="rooftop-solar.html">Rooftop solar</a>
        <a href="pipeline.html">Pipeline</a>
        <a href="docs/index.html">Docs</a>
      </nav>
    </div>
    <div id="source-controls">
      <label>Datasets <select id="dataset-context">
        <option value="local">Local cache and calculations</option>
        <option value="published">Published map</option>
      </select></label>
      <button type="button" id="refresh">Refresh datasets</button>
    </div>
    <p id="status" role="status">Loading datasets...</p>
  </header>
  <div id="map"></div>
</div>
<script src="data_explorer.js"></script>
</body>
</html>
